<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desapegos</title>
<meta name="description" content="Itens à venda. Toque em um item para ver as fotos e os detalhes.">
<meta property="og:title" content="Desapegos">
<meta property="og:description" content="Itens à venda. Toque em um item para ver as fotos e os detalhes.">
<meta property="og:image" content="https://ewerside.github.io/desapegos/fotos/watch4-capa.jpg">
<style>
  :root { --fundo:#f6f4f0; --card:#fff; --texto:#1d1d1b; --suave:#6b6a66; --destaque:#1f6f5c; --borda:#e4e1da; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--fundo); color:var(--texto); }
  header { padding:28px 20px 8px; max-width:1100px; margin:0 auto; }
  h1 { margin:0 0 6px; font-size:28px; letter-spacing:-.5px; }
  header p { margin:0; color:var(--suave); font-size:15px; line-height:1.45; }
  main { max-width:1100px; margin:0 auto; padding:16px 14px 40px; display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); }
  @media (min-width:700px){ main { grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:18px; } }
  .card { all:unset; cursor:pointer; background:var(--card); border:1px solid var(--borda); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; transition:transform .15s, box-shadow .15s; }
  .card:hover, .card:focus-visible { transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,.08); }
  .card:focus-visible { outline:2px solid var(--destaque); }
  .card img { width:100%; aspect-ratio:1; object-fit:cover; background:#eee; display:block; }
  .info { padding:10px 12px 12px; display:flex; flex-direction:column; gap:3px; }
  .nome { font-weight:600; font-size:15px; line-height:1.25; }
  .resumo { color:var(--suave); font-size:13px; line-height:1.3; }
  .preco { color:var(--destaque); font-weight:700; font-size:17px; margin-top:4px; }
  footer { text-align:center; color:var(--suave); font-size:14px; padding:0 20px 36px; }
  dialog { border:none; padding:0; width:min(760px,100vw); max-height:100dvh; border-radius:16px; background:var(--card); color:var(--texto); }
  @media (max-width:700px){ dialog { width:100vw; height:100dvh; max-width:none; max-height:none; margin:0; border-radius:0; } }
  dialog::backdrop { background:rgba(20,20,20,.6); }
  .topo { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; position:sticky; top:0; background:var(--card); z-index:2; border-bottom:1px solid var(--borda); }
  .fechar { all:unset; cursor:pointer; font-size:15px; padding:8px 12px; border-radius:8px; background:var(--fundo); }
  .galeria { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; background:#111; }
  .galeria img { flex:0 0 100%; width:100%; max-height:70dvh; object-fit:contain; scroll-snap-align:center; }
  .contador { text-align:center; color:var(--suave); font-size:13px; padding:8px 0 0; }
  .detalhe { padding:12px 18px 26px; }
  .detalhe h2 { margin:6px 0 4px; font-size:21px; }
  .detalhe .preco { font-size:22px; }
  .detalhe p { line-height:1.55; margin:10px 0 0; white-space:pre-line; }
  .setas { display:flex; justify-content:center; gap:10px; padding-top:8px; }
  .setas button { all:unset; cursor:pointer; padding:6px 14px; border:1px solid var(--borda); border-radius:8px; font-size:14px; }
</style>
</head>
<body>
<header>
  <h1>Desapegos</h1>
  <p>Toque em um item para ver as fotos e os detalhes. Para comprar, é só me chamar no WhatsApp.</p>
</header>
<main>
<button class="card" data-id="watch4"><img src="fotos/watch4-capa.jpg" alt="Samsung Galaxy Watch4 40 mm" loading="lazy"><span class="info"><span class="nome">Samsung Galaxy Watch4 40 mm</span><span class="resumo">Preto, com caixa e carregador</span><span class="preco">R$ 460</span></span></button>
<button class="card" data-id="lava-e-seca"><img src="fotos/lava-e-seca-capa.jpg" alt="Lava e seca Samsung 13 kg" loading="lazy"><span class="info"><span class="nome">Lava e seca Samsung 13 kg</span><span class="resumo">Inox, 127 V, comprada em out/2024</span><span class="preco">R$ 3.500</span></span></button>
<button class="card" data-id="traxxas"><img src="fotos/traxxas-capa.jpg" alt="Carro de controle remoto Traxxas Slash" loading="lazy"><span class="info"><span class="nome">Carro de controle remoto Traxxas Slash</span><span class="resumo">Escala 1/10, completo, com rádio</span><span class="preco">R$ 1.700</span></span></button>
<button class="card" data-id="giz"><img src="fotos/giz-capa.jpg" alt="Giz de calçada Crayola (48)" loading="lazy"><span class="info"><span class="nome">Giz de calçada Crayola (48)</span><span class="resumo">Lavável, caixa com 48</span><span class="preco">R$ 50</span></span></button>
<button class="card" data-id="lumix"><img src="fotos/lumix-capa.jpg" alt="Câmera Panasonic Lumix DMC-LZ6" loading="lazy"><span class="info"><span class="nome">Câmera Panasonic Lumix DMC-LZ6</span><span class="resumo">Zoom óptico 6x, funcionando</span><span class="preco">R$ 340</span></span></button>
<button class="card" data-id="zippos"><img src="fotos/zippos-capa.jpg" alt="Isqueiros Zippo (2)" loading="lazy"><span class="info"><span class="nome">Isqueiros Zippo (2)</span><span class="resumo">Originais, Made in USA, na caixa</span><span class="preco">R$ 220 cada</span></span></button>
<button class="card" data-id="luva"><img src="fotos/luva-capa.jpg" alt="Luva de beisebol Rawlings 13&quot;" loading="lazy"><span class="info"><span class="nome">Luva de beisebol Rawlings 13&quot;</span><span class="resumo">Modelo RSB130GB</span><span class="preco">R$ 220</span></span></button>
<button class="card" data-id="ssd"><img src="fotos/ssd-capa.jpg" alt="SSD WD NVMe 128 GB M.2 2230" loading="lazy"><span class="info"><span class="nome">SSD WD NVMe 128 GB M.2 2230</span><span class="resumo">Formato pequeno (2230)</span><span class="preco">R$ 160</span></span></button>
<button class="card" data-id="cabo"><img src="fotos/cabo-capa.jpg" alt="Cabo de rede/CFTV Sumay" loading="lazy"><span class="info"><span class="nome">Cabo de rede/CFTV Sumay</span><span class="resumo">Caixa de 305 m, aberta</span><span class="preco">R$ 120</span></span></button>
<button class="card" data-id="pratos"><img src="fotos/pratos-capa.jpg" alt="Pratos de coleção Franklin Mint (6)" loading="lazy"><span class="info"><span class="nome">Pratos de coleção Franklin Mint (6)</span><span class="resumo">Porcelana, edição limitada</span><span class="preco">R$ 70 cada</span></span></button>
<button class="card" data-id="saleiros"><img src="fotos/saleiros-capa.jpg" alt="Saleiros de vidro (kit com 6)" loading="lazy"><span class="info"><span class="nome">Saleiros de vidro (kit com 6)</span><span class="resumo">Formato de lâmpada, sem uso</span><span class="preco">R$ 50</span></span></button>
</main>
<footer>11 itens disponíveis</footer>

<dialog id="janela" aria-label="Detalhes do item">
  <div class="topo"><strong id="j-titulo"></strong><button class="fechar" id="fechar">Fechar</button></div>
  <div class="galeria" id="galeria"></div>
  <div class="contador" id="contador"></div>
  <div class="setas"><button id="ant" aria-label="Foto anterior">‹ Anterior</button><button id="prox" aria-label="Próxima foto">Próxima ›</button></div>
  <div class="detalhe"><h2 id="j-nome"></h2><div class="preco" id="j-preco"></div><p id="j-desc"></p></div>
</dialog>

<script>
const DADOS = {"watch4": {"nome": "Samsung Galaxy Watch4 40 mm", "preco": "R$ 460", "descricao": "Smartwatch Samsung Galaxy Watch4 40 mm, versão Bluetooth (SM-R860), preto, com pulseira esportiva original.\nAcompanha caixa original e carregador.\nMarcas de uso leves, tudo funcionando.", "arquivos": ["watch4-1.jpg", "watch4-2.jpg", "watch4-3.jpg", "watch4-4.jpg"]}, "lava-e-seca": {"nome": "Lava e seca Samsung 13 kg", "preco": "R$ 3.500", "descricao": "Lava e seca Samsung WD13T, 13 kg, 127 V, inox.\nComprada em outubro de 2024, funcionando.\nAcompanha manual e capa protetora.", "arquivos": ["lava-e-seca-1.jpg", "lava-e-seca-2.jpg", "lava-e-seca-3.jpg", "lava-e-seca-4.jpg", "lava-e-seca-5.jpg", "lava-e-seca-6.jpg"]}, "traxxas": {"nome": "Carro de controle remoto Traxxas Slash", "preco": "R$ 1.700", "descricao": "Traxxas Slash 2WD, escala 1/10 (modelo 58034-1), pintura Hawaiian.\nCompleto, com rádio, baterias e carregador.\nPouquíssimo usado, funcionando.", "arquivos": ["traxxas-1.jpg", "traxxas-2.jpg", "traxxas-3.jpg", "traxxas-4.jpg", "traxxas-5.jpg", "traxxas-6.jpg"]}, "giz": {"nome": "Giz de calçada Crayola (48)", "preco": "R$ 50", "descricao": "Giz de calçada Crayola Washable Sidewalk Chalk, lavável, caixa com 48 gizes coloridos.", "arquivos": ["giz-1.jpg", "giz-2.jpg", "giz-3.jpg"]}, "lumix": {"nome": "Câmera Panasonic Lumix DMC-LZ6", "preco": "R$ 340", "descricao": "Câmera digital Panasonic Lumix DMC-LZ6, zoom óptico 6x, com alça.\nFunciona com pilhas AA. Testada, funcionando.\nNão acompanha cabo.", "arquivos": ["lumix-1.jpg", "lumix-2.jpg", "lumix-3.jpg", "lumix-4.jpg"]}, "zippos": {"nome": "Isqueiros Zippo (2)", "preco": "R$ 220 cada", "descricao": "Dois isqueiros Zippo originais, Made in USA, cada um na caixa: \"Serenity Prayer\" e \"Human Being\".\nVazios, sem fluido.\nR$ 220 cada, ou os dois por R$ 400.", "arquivos": ["zippos-1.jpg", "zippos-2.jpg", "zippos-3.jpg", "zippos-4.jpg", "zippos-5.jpg"]}, "luva": {"nome": "Luva de beisebol Rawlings 13\"", "preco": "R$ 220", "descricao": "Luva de beisebol Rawlings RSB130GB, 13 polegadas.", "arquivos": ["luva-1.jpg", "luva-2.jpg"]}, "ssd": {"nome": "SSD WD NVMe 128 GB M.2 2230", "preco": "R$ 160", "descricao": "SSD Western Digital PC SN520 NVMe, 128 GB, formato M.2 2230 (o modelo curto, usado em notebooks finos, Surface e Steam Deck).", "arquivos": ["ssd-1.jpg", "ssd-2.jpg", "ssd-3.jpg"]}, "cabo": {"nome": "Cabo de rede/CFTV Sumay", "preco": "R$ 120", "descricao": "Cabo Sumay para CFTV e rede, 4 pares, 24 AWG, CCA (cobre revestido de alumínio).\nCaixa de 305 m aberta; a metragem restante não foi medida.", "arquivos": ["cabo-1.jpg", "cabo-2.jpg", "cabo-3.jpg", "cabo-4.jpg"]}, "pratos": {"nome": "Pratos de coleção Franklin Mint (6)", "preco": "R$ 70 cada", "descricao": "Pratos decorativos de porcelana Franklin Mint, edição limitada numerada, borda dourada, para pendurar na parede.\nArte indígena norte-americana de Hermon Adams, Paul Calle e Gary Ampel.\nR$ 70 cada, ou os 6 por R$ 380.\nO de fundo azul, com lobos, tem um pequeno lascado na borda: esse sai por R$ 30.", "arquivos": ["pratos-1.jpg", "pratos-2.jpg", "pratos-3.jpg", "pratos-4.jpg", "pratos-5.jpg", "pratos-6.jpg", "pratos-7.jpg", "pratos-8.jpg"]}, "saleiros": {"nome": "Saleiros de vidro (kit com 6)", "preco": "R$ 50", "descricao": "Saleiros de vidro em formato de lâmpada, tampa de metal de rosca. Sem uso, com a etiqueta da loja.\nKit com 6. Tenho vários kits.", "arquivos": ["saleiros-1.jpg", "saleiros-2.jpg"]}};
const janela = document.getElementById('janela');
const galeria = document.getElementById('galeria');
const contador = document.getElementById('contador');
let total = 0;
function atualizaContador() {
  const i = Math.round(galeria.scrollLeft / Math.max(galeria.clientWidth, 1));
  contador.textContent = total > 1 ? `Foto ${i + 1} de ${total}` : '';
}
function abrir(id) {
  const d = DADOS[id]; if (!d) return;
  document.getElementById('j-titulo').textContent = d.preco;
  document.getElementById('j-nome').textContent = d.nome;
  document.getElementById('j-preco').textContent = d.preco;
  document.getElementById('j-desc').textContent = d.descricao;
  galeria.innerHTML = '';
  d.arquivos.forEach((a, i) => {
    const img = document.createElement('img');
    img.src = 'fotos/' + a; img.alt = d.nome + ' (foto ' + (i + 1) + ')';
    if (i > 0) img.loading = 'lazy';
    galeria.appendChild(img);
  });
  total = d.arquivos.length;
  document.querySelector('.setas').style.display = total > 1 ? 'flex' : 'none';
  janela.showModal(); galeria.scrollLeft = 0; atualizaContador();
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
}
function fechar() { janela.close(); }
janela.addEventListener('close', () => { try { history.replaceState(null, '', location.pathname); } catch (e) {} });
document.querySelectorAll('.card').forEach(c => c.addEventListener('click', () => abrir(c.dataset.id)));
document.getElementById('fechar').addEventListener('click', fechar);
janela.addEventListener('click', e => { if (e.target === janela) fechar(); });
galeria.addEventListener('scroll', atualizaContador, { passive: true });
document.getElementById('ant').addEventListener('click', () => galeria.scrollBy({ left: -galeria.clientWidth, behavior: 'smooth' }));
document.getElementById('prox').addEventListener('click', () => galeria.scrollBy({ left: galeria.clientWidth, behavior: 'smooth' }));
if (location.hash && DADOS[location.hash.slice(1)]) abrir(location.hash.slice(1));
</script>
</body>
</html>
