<script>
const DADOS = {{DADOS}};
const FONE = '5521995020427';
const API = 'https://wasbvkkavtmrxssytwho.supabase.co/rest/v1/desapegos_eventos';
const CHAVE = 'sb_publishable_QYf4rI8sp3Q3EaJ3Rs5PVQ_UT0FI5aO';

/* Estatísticas: só códigos aleatórios, nenhum dado pessoal. */
function guardado(onde, nome, novo) {
  try { let v = onde.getItem(nome); if (!v && novo) { v = novo; onde.setItem(nome, v); } return v; } catch (e) { return novo || null; }
}
const aleatorio = () => Math.random().toString(36).slice(2, 12);
const params = new URLSearchParams(location.search);
const grupoUrl = (params.get('g') || '').toLowerCase().slice(0, 40) || null;
let grupo = grupoUrl;
try { if (grupoUrl) localStorage.setItem('desapegos_grupo', grupoUrl); else grupo = localStorage.getItem('desapegos_grupo'); } catch (e) {}
const visitante = guardado(localStorage, 'desapegos_visitante', aleatorio());
const sessao = guardado(sessionStorage, 'desapegos_sessao', aleatorio());
const dispositivo = matchMedia('(pointer: coarse)').matches ? 'celular' : 'computador';
const inicio = Date.now();
let dono = false;
try { if (params.has('eu')) localStorage.setItem('desapegos_dono', '1'); dono = localStorage.getItem('desapegos_dono') === '1'; } catch (e) {}
function registra(tipo, extra) {
  if (params.has('teste') || dono) return;
  const corpo = Object.assign({ tipo, grupo, visitante, sessao, dispositivo }, extra || {});
  try {
    fetch(API, { method: 'POST', keepalive: true, headers: { apikey: CHAVE, Authorization: 'Bearer ' + CHAVE, 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify(corpo) }).catch(() => {});
  } catch (e) {}
}
const CONDOMINIOS = { majestic: 'Majestic', orquidea: 'Orquídea', 'saint-tropez': 'Saint Tropez' };
if (grupo && CONDOMINIOS[grupo]) document.getElementById('bilhete').textContent = `Oi! Sou vizinho de vocês aqui no ${CONDOMINIOS[grupo]} e estou desapegando de algumas coisas. Passe as fotos pelas setas e toque num item para ver os detalhes.`;
registra('visita', { origem: (document.referrer || '').slice(0, 300) || null, item: location.hash.slice(1) || null });
let saiu = false;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && !saiu) { saiu = true; registra('saiu', { segundos: Math.min(86400, Math.round((Date.now() - inicio) / 1000)) }); }
});

function linkZap(item) {
  const d = item && DADOS[item];
  const msg = d ? `Oi! Vi seus desapegos e tenho interesse em: ${d.nome} (${d.preco}). Ainda está disponível?` : 'Oi! Vi seus desapegos e queria saber mais.';
  return `https://wa.me/${FONE}?text=${encodeURIComponent(msg)}`;
}
function preparaZap(a, item) {
  a.href = linkZap(item);
  a.addEventListener('click', e => { e.stopPropagation(); registra('whatsapp', { item: item || a.dataset.item || null, local_clique: a.dataset.local }); });
}

function carrossel(el, item, onde, aoMudar) {
  const trilho = el.querySelector('.trilho');
  const total = trilho.children.length;
  const ant = el.querySelector('.ant'), prox = el.querySelector('.prox');
  const pontos = el.querySelector('.pontos');
  if (pontos) pontos.innerHTML = total > 1 ? '<i></i>'.repeat(total) : '';
  let i = 0, x0 = null, arrastou = false;
  function vai(n, usuario) {
    const novo = Math.max(0, Math.min(total - 1, n));
    if (usuario && novo !== i) registra('foto', { item, local_clique: onde });
    i = novo;
    trilho.style.transform = `translateX(${-100 * i}%)`;
    ant.hidden = i === 0; prox.hidden = i === total - 1;
    if (pontos) [...pontos.children].forEach((p, k) => p.classList.toggle('ativo', k === i));
    if (aoMudar) aoMudar(i, total);
  }
  ant.addEventListener('click', e => { e.stopPropagation(); vai(i - 1, true); });
  prox.addEventListener('click', e => { e.stopPropagation(); vai(i + 1, true); });
  el.addEventListener('pointerdown', e => { if (!e.target.closest('.seta')) { x0 = e.clientX; arrastou = false; } });
  el.addEventListener('pointerup', e => {
    if (x0 === null) return;
    const dx = e.clientX - x0; x0 = null;
    if (Math.abs(dx) > 40) { arrastou = true; vai(dx < 0 ? i + 1 : i - 1, true); }
  });
  el.addEventListener('click', e => { if (arrastou) { e.stopImmediatePropagation(); arrastou = false; } }, true);
  vai(0);
  return { vai: n => vai(n, true), get i() { return i; } };
}

const janela = document.getElementById('janela');
let atual = null;
function abrir(id, como) {
  const d = DADOS[id]; if (!d) return;
  const novo = document.createElement('div');
  novo.className = 'carrossel'; novo.id = 'j-carrossel';
  novo.innerHTML = d.html + '<button class="seta ant" aria-label="Foto anterior"></button><button class="seta prox" aria-label="Próxima foto"></button>';
  document.getElementById('j-carrossel').replaceWith(novo);
  document.getElementById('j-nome').textContent = d.nome;
  document.getElementById('j-preco').textContent = d.preco;
  document.getElementById('j-desc').textContent = d.descricao;
  const zap = document.getElementById('j-zap');
  zap.href = linkZap(id); zap.dataset.item = id;
  atual = carrossel(novo, id, 'janela', (i, t) => { document.getElementById('j-contador').textContent = t > 1 ? `Foto ${i + 1} de ${t}` : ''; });
  janela.showModal();
  registra('abriu_item', { item: id, local_clique: como });
  try { history.replaceState(null, '', location.search + '#' + id); } catch (e) {}
}
document.getElementById('j-zap').addEventListener('click', e => { registra('whatsapp', { item: e.currentTarget.dataset.item, local_clique: 'janela' }); });

document.querySelectorAll('header .zap, footer .zap').forEach(a => preparaZap(a, null));
document.querySelectorAll('.nota').forEach(nota => {
  const id = nota.dataset.id;
  carrossel(nota.querySelector('.carrossel'), id, 'cartao');
  nota.querySelector('.ver').addEventListener('click', () => abrir(id, 'botao'));
  nota.querySelector('.carrossel').addEventListener('click', e => { e.stopPropagation(); abrir(id, 'foto'); });
  nota.querySelector('.ver').addEventListener('click', e => e.stopPropagation());
  nota.addEventListener('click', () => abrir(id, 'cartao'));
  preparaZap(nota.querySelector('.zap'), id);
});

document.getElementById('fechar').addEventListener('click', () => janela.close());
janela.addEventListener('click', e => { if (e.target === janela) janela.close(); });
janela.addEventListener('close', () => { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} });
janela.addEventListener('keydown', e => {
  if (!atual) return;
  if (e.key === 'ArrowRight') atual.vai(atual.i + 1);
  if (e.key === 'ArrowLeft') atual.vai(atual.i - 1);
});
if (location.hash && DADOS[location.hash.slice(1)]) abrir(location.hash.slice(1), 'link');
</script>
</body>
